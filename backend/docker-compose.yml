version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ethara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethara_user
      POSTGRES_PASSWORD: ethara_pass
      POSTGRES_DB: ethara_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethara_user -d ethara_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ethara_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ethara_user:ethara_pass@db:5432/ethara_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: fallback
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata: